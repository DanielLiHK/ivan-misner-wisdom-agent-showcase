<rect x="55" y="115" width="230" height="115" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="85" y="155" fill="#1e3a8a">Public sources</text><text x="85" y="188" fill="#1e3a8a">official pages</text><text x="85" y="215" fill="#1e3a8a">book summaries</text>
<path d="M300 172 H385" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="400" y="115" width="230" height="115" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="430" y="155" fill="#14532d">Reviewed claims</text><text x="430" y="188" fill="#14532d">source + concept</text><text x="430" y="215" fill="#14532d">limits + status</text>
<path d="M645 172 H730" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="745" y="95" width="370" height="155" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="775" y="135" fill="#78350f">Public persona layers</text><text x="775" y="168" fill="#78350f">Soul · Role · Knowledge</text><text x="775" y="198" fill="#78350f">Thinking Frameworks</text><text x="775" y="228" fill="#78350f">theory status + evidence sample</text>
