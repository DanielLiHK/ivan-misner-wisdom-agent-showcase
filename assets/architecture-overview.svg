<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Ivan Misner Wisdom Agent public showcase architecture</title>
<desc id="desc">Public sources become reviewed knowledge and persona layers; private working systems remain outside the showcase.</desc>
